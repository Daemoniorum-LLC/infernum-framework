<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .primary { fill: #0b4b3b; }
      .accent { fill: #1aa39a; }
    </style>
  </defs>
  <!-- Outer flame shape -->
  <path class="primary" d="
    M 100 15
    C 120 35, 150 55, 160 90
    C 170 125, 155 160, 130 175
    C 115 185, 100 190, 100 190
    C 100 190, 85 185, 70 175
    C 45 160, 30 125, 40 90
    C 50 55, 80 35, 100 15
    Z
  "/>
  <!-- Inner flame 1 -->
  <path class="accent" d="
    M 100 45
    C 115 60, 135 75, 140 100
    C 145 125, 130 150, 110 160
    C 105 163, 100 165, 100 165
    C 100 165, 95 163, 90 160
    C 70 150, 55 125, 60 100
    C 65 75, 85 60, 100 45
    Z
  "/>
  <!-- Core flame -->
  <path class="primary" d="
    M 100 80
    C 110 90, 120 100, 120 115
    C 120 130, 110 145, 100 150
    C 90 145, 80 130, 80 115
    C 80 100, 90 90, 100 80
    Z
  "/>
  <!-- Neural network nodes (AI element) -->
  <g class="accent">
    <circle cx="75" cy="120" r="4"/>
    <circle cx="125" cy="120" r="4"/>
    <circle cx="100" cy="95" r="4"/>
    <line x1="75" y1="120" x2="100" y2="95" stroke="#1aa39a" stroke-width="2"/>
    <line x1="125" y1="120" x2="100" y2="95" stroke="#1aa39a" stroke-width="2"/>
    <line x1="75" y1="120" x2="125" y2="120" stroke="#1aa39a" stroke-width="2"/>
  </g>
</svg>
