[package]
name = "test-utils"
version = "0.2.0-rc.2"
edition = "2021"
description = "Testing utilities for Infernum crates"
license = "MIT"
publish = false

[dependencies]
# Core Infernum crates
infernum-core = { path = "../infernum-core" }

# Async runtime
tokio = { version = "1.48", features = ["full", "test-util"] }

# HTTP testing
axum = "0.8"
tower = "0.5"
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.20", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true
