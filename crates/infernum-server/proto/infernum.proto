// Infernum gRPC API - Internal service interface for high-performance inference

syntax = "proto3";

package infernum.v1;

option java_package = "com.daemoniorum.infernum.v1";
option java_outer_classname = "InfernumProto";
option go_package = "github.com/Daemoniorum-LLC/infernum-go/v1;infernumv1";

// The Infernum inference service.
service InfernumService {
    // Chat completion with messages context.
    rpc ChatCompletion(ChatCompletionRequest) returns (ChatCompletionResponse);

    // Streaming chat completion.
    rpc ChatCompletionStream(ChatCompletionRequest) returns (stream ChatCompletionChunk);

    // Text completion (raw prompt).
    rpc Completion(CompletionRequest) returns (CompletionResponse);

    // Streaming text completion.
    rpc CompletionStream(CompletionRequest) returns (stream CompletionChunk);

    // Generate embeddings.
    rpc Embed(EmbedRequest) returns (EmbedResponse);

    // List available models.
    rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

    // Get model information.
    rpc GetModel(GetModelRequest) returns (Model);

    // Health check.
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// The model management service (admin).
service ModelService {
    // Load a model into memory.
    rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);

    // Unload a model from memory.
    rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);

    // Warmup a model.
    rpc WarmupModel(WarmupModelRequest) returns (WarmupModelResponse);

    // Get status of all loaded models.
    rpc GetModelsStatus(GetModelsStatusRequest) returns (GetModelsStatusResponse);
}

// ============================================================================
// Common Types
// ============================================================================

// Priority level for requests.
enum Priority {
    PRIORITY_UNSPECIFIED = 0;
    PRIORITY_BACKGROUND = 1;
    PRIORITY_NORMAL = 2;
    PRIORITY_HIGH = 3;
    PRIORITY_CRITICAL = 4;
}

// Token usage information.
message Usage {
    int32 prompt_tokens = 1;
    int32 completion_tokens = 2;
    int32 total_tokens = 3;
}

// Log probability information.
message LogProb {
    string token = 1;
    float logprob = 2;
    repeated bytes bytes = 3;
}

// Top log probabilities.
message TopLogProbs {
    repeated LogProb top_logprobs = 1;
}

// ============================================================================
// Chat Completion
// ============================================================================

// Role in a chat conversation.
enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_SYSTEM = 1;
    ROLE_USER = 2;
    ROLE_ASSISTANT = 3;
    ROLE_TOOL = 4;
}

// A message in the chat conversation.
message ChatMessage {
    Role role = 1;
    string content = 2;
    optional string name = 3;
    repeated ToolCall tool_calls = 4;
    optional string tool_call_id = 5;
}

// Tool/function call.
message ToolCall {
    string id = 1;
    string type = 2;
    FunctionCall function = 3;
}

// Function call details.
message FunctionCall {
    string name = 1;
    string arguments = 2;
}

// Tool definition.
message Tool {
    string type = 1;
    FunctionDefinition function = 2;
}

// Function definition.
message FunctionDefinition {
    string name = 1;
    optional string description = 2;
    string parameters = 3;  // JSON Schema as string
}

// Response format specification.
message ResponseFormat {
    string type = 1;  // "text", "json_object", "json_schema"
    optional JsonSchema json_schema = 2;
}

// JSON Schema for structured outputs.
message JsonSchema {
    string name = 1;
    optional string description = 2;
    string schema = 3;  // JSON Schema as string
    optional bool strict = 4;
}

// Chat completion request.
message ChatCompletionRequest {
    string model = 1;
    repeated ChatMessage messages = 2;
    optional float temperature = 3;
    optional float top_p = 4;
    optional int32 max_tokens = 5;
    repeated string stop = 6;
    optional float presence_penalty = 7;
    optional float frequency_penalty = 8;
    optional bool logprobs = 9;
    optional int32 top_logprobs = 10;
    optional int32 n = 11;
    optional int64 seed = 12;
    repeated Tool tools = 13;
    optional string tool_choice = 14;
    optional ResponseFormat response_format = 15;
    optional string user = 16;
    Priority priority = 17;
    optional string request_id = 18;
}

// Chat completion response.
message ChatCompletionResponse {
    string id = 1;
    string object = 2;
    int64 created = 3;
    string model = 4;
    repeated ChatChoice choices = 5;
    Usage usage = 6;
    optional string system_fingerprint = 7;
}

// Chat completion choice.
message ChatChoice {
    int32 index = 1;
    ChatMessage message = 2;
    optional TopLogProbs logprobs = 3;
    string finish_reason = 4;
}

// Streaming chat completion chunk.
message ChatCompletionChunk {
    string id = 1;
    string object = 2;
    int64 created = 3;
    string model = 4;
    repeated ChatChoiceDelta choices = 5;
    optional Usage usage = 6;
}

// Delta for streaming.
message ChatChoiceDelta {
    int32 index = 1;
    ChatMessageDelta delta = 2;
    optional TopLogProbs logprobs = 3;
    optional string finish_reason = 4;
}

// Message delta for streaming.
message ChatMessageDelta {
    optional Role role = 1;
    optional string content = 2;
    repeated ToolCall tool_calls = 3;
}

// ============================================================================
// Text Completion
// ============================================================================

// Text completion request.
message CompletionRequest {
    string model = 1;
    string prompt = 2;
    optional float temperature = 3;
    optional float top_p = 4;
    optional int32 max_tokens = 5;
    repeated string stop = 6;
    optional float presence_penalty = 7;
    optional float frequency_penalty = 8;
    optional bool logprobs = 9;
    optional int32 top_logprobs = 10;
    optional int32 n = 11;
    optional int64 seed = 12;
    optional bool echo = 13;
    optional string suffix = 14;
    optional string user = 15;
    Priority priority = 16;
    optional string request_id = 17;
}

// Text completion response.
message CompletionResponse {
    string id = 1;
    string object = 2;
    int64 created = 3;
    string model = 4;
    repeated CompletionChoice choices = 5;
    Usage usage = 6;
}

// Text completion choice.
message CompletionChoice {
    int32 index = 1;
    string text = 2;
    optional TopLogProbs logprobs = 3;
    string finish_reason = 4;
}

// Streaming completion chunk.
message CompletionChunk {
    string id = 1;
    string object = 2;
    int64 created = 3;
    string model = 4;
    repeated CompletionChoiceDelta choices = 5;
}

// Delta for streaming.
message CompletionChoiceDelta {
    int32 index = 1;
    string text = 2;
    optional TopLogProbs logprobs = 3;
    optional string finish_reason = 4;
}

// ============================================================================
// Embeddings
// ============================================================================

// Embedding request.
message EmbedRequest {
    string model = 1;
    repeated string input = 2;
    optional string encoding_format = 3;  // "float" or "base64"
    optional int32 dimensions = 4;
    optional string user = 5;
    Priority priority = 6;
    optional string request_id = 7;
}

// Embedding response.
message EmbedResponse {
    string object = 1;
    repeated Embedding data = 2;
    string model = 3;
    Usage usage = 4;
}

// Single embedding.
message Embedding {
    string object = 1;
    int32 index = 2;
    repeated float embedding = 3;
}

// ============================================================================
// Models
// ============================================================================

// List models request.
message ListModelsRequest {}

// List models response.
message ListModelsResponse {
    string object = 1;
    repeated Model data = 2;
}

// Get model request.
message GetModelRequest {
    string model_id = 1;
}

// Model information.
message Model {
    string id = 1;
    string object = 2;
    int64 created = 3;
    string owned_by = 4;
    optional int32 context_length = 5;
    optional string architecture = 6;
}

// ============================================================================
// Model Management (Admin)
// ============================================================================

// Load model request.
message LoadModelRequest {
    string model = 1;
    optional LoadOptions options = 2;
}

// Load options.
message LoadOptions {
    optional string device = 1;
    optional string dtype = 2;
    optional int32 context_length = 3;
    optional int32 gpu_layers = 4;
}

// Load model response.
message LoadModelResponse {
    bool success = 1;
    string model = 2;
    optional string message = 3;
    int64 load_time_ms = 4;
}

// Unload model request.
message UnloadModelRequest {
    string model = 1;
}

// Unload model response.
message UnloadModelResponse {
    bool success = 1;
    string model = 2;
    optional string message = 3;
}

// Warmup model request.
message WarmupModelRequest {
    string model = 1;
    optional int32 prompt_tokens = 2;
    optional int32 completion_tokens = 3;
}

// Warmup model response.
message WarmupModelResponse {
    bool success = 1;
    string model = 2;
    int64 warmup_time_ms = 3;
    optional string message = 4;
}

// Get models status request.
message GetModelsStatusRequest {}

// Get models status response.
message GetModelsStatusResponse {
    repeated ModelStatus models = 1;
}

// Model status.
message ModelStatus {
    string model = 1;
    string status = 2;  // "loaded", "loading", "unloaded", "error"
    int64 memory_bytes = 3;
    int32 active_requests = 4;
    int64 total_requests = 5;
    int64 loaded_at = 6;
}

// ============================================================================
// Health Check
// ============================================================================

// Health check request.
message HealthCheckRequest {}

// Health check response.
message HealthCheckResponse {
    string status = 1;  // "healthy", "degraded", "unhealthy"
    string version = 2;
    int64 uptime_seconds = 3;
    repeated ComponentHealth components = 4;
}

// Component health.
message ComponentHealth {
    string name = 1;
    string status = 2;
    optional string message = 3;
}
