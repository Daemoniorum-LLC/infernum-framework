[package]
name = "beleth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Autonomous agent framework - The King commands legions"

[dependencies]
infernum-core = { path = "../infernum-core", version = "0.2.0-rc.2" }
abaddon = { path = "../abaddon", version = "0.2.0-rc.2" }
malphas = { path = "../malphas", version = "0.2.0-rc.2" }
stolas = { path = "../stolas", version = "0.2.0-rc.2", default-features = false }
dantalion = { path = "../dantalion", version = "0.2.0-rc.2" }
grimoire-loader = { path = "../grimoire-loader", version = "0.2.0-rc.2" }

# Async
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# HTTP (for tools)
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Observability
tracing = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
glob = "0.3"
dirs = "6.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
mockall = { workspace = true }
wiremock = { workspace = true }
tempfile = "3.26"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.10"
tracing-subscriber = "0.3"

[[bench]]
name = "agent_benchmarks"
harness = false

[[example]]
name = "wellbeing_monitor"
path = "examples/wellbeing_monitor.rs"

[[example]]
name = "monitored_inference"
path = "examples/monitored_inference.rs"

[[example]]
name = "ooda_with_wellbeing"
path = "examples/ooda_with_wellbeing.rs"

[lints]
workspace = true
