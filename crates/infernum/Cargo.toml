[package]
name = "infernum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Infernum CLI - From the depths, intelligence rises"
readme = "README.md"

[[bin]]
name = "infernum"
path = "src/main.rs"

[features]
# Note: cuda not in default - requires explicit opt-in for GPU support
default = ["server", "llama-cpp"]
server = ["infernum-server"]
# GPU features - propagate to abaddon
cuda = ["abaddon/cuda"]
metal = ["abaddon/metal"]
haagenti-gpu = ["cuda", "abaddon/haagenti-gpu"]
# llama.cpp backend (high-performance GGUF inference)
llama-cpp = ["abaddon/llama-cpp"]
llama-cpp-cuda = ["llama-cpp", "abaddon/llama-cpp-cuda"]
llama-cpp-metal = ["llama-cpp", "abaddon/llama-cpp-metal"]
llama-cpp-vulkan = ["llama-cpp", "abaddon/llama-cpp-vulkan"]

[dependencies]
infernum-core = { path = "../infernum-core", version = "0.2.0-rc.1" }
abaddon = { path = "../abaddon", version = "0.2.0-rc.1" }
malphas = { path = "../malphas", version = "0.2.0-rc.1" }
stolas = { path = "../stolas", version = "0.2.0-rc.1", default-features = false }
beleth = { path = "../beleth", version = "0.2.0-rc.1" }
infernum-asmodeus = { path = "../asmodeus", version = "0.2.0-rc.1" }
dantalion = { path = "../dantalion", version = "0.2.0-rc.1" }
grimoire-loader = { path = "../grimoire-loader", version = "0.2.0-rc.1" }
paimon = { path = "../paimon", version = "0.2.0-rc.1" }
infernum-server = { path = "../infernum-server", version = "0.2.0-rc.1", optional = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Model management
hf-hub = { workspace = true }
dirs = "6.0"

# ML
candle-core = { workspace = true }
safetensors = { workspace = true }

# CLI
clap = { workspace = true }
clap_complete = "4.5"
dialoguer = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }

# Configuration
figment = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }

# Error handling
color-eyre = { workspace = true }
anyhow = { workspace = true }

# System info
num_cpus = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.19"

[lints]
workspace = true
