[package]
name = "abaddon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LLM inference engine - The Destroyer renders judgment"

[features]
default = ["cpu"]
cpu = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "dep:cudarc"]
haagenti-gpu = ["cuda", "dep:haagenti-cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
flash-attn = ["cuda", "dep:candle-flash-attn"]
cuda-experimental = ["cuda"]  # Experimental CUDA kernels (warp-parallel LZ4, etc.)
mkl = ["candle-core/mkl"]
accelerate = ["candle-core/accelerate"]
neural-compression = []  # TODO(#TBD): add dep:haagenti-neural when available

# llama.cpp backend for production inference (50-100x faster than Candle)
llama-cpp = ["dep:llama_cpp"]
llama-cpp-cuda = ["llama-cpp", "llama_cpp/cuda"]
llama-cpp-metal = ["llama-cpp", "llama_cpp/metal"]
llama-cpp-vulkan = ["llama-cpp", "llama_cpp/vulkan"]

[dependencies]
infernum-core = { path = "../infernum-core", version = "0.2.0-rc.2" }
dantalion = { path = "../dantalion", version = "0.2.0-rc.2" }
infernum-arbiter = { path = "../arbiter", version = "0.2.0-rc.2" }

# Async
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# ML
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
safetensors = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }

# CUDA runtime (optional, enabled with cuda feature)
cudarc = { workspace = true, optional = true }


# Bounded channels for pipeline mode (used by holotensor converter)
crossbeam = { version = "0.8", features = ["crossbeam-channel"] }

# Flash Attention (optional, enabled with flash-attn feature)
candle-flash-attn = { version = "0.9", optional = true }

# llama.cpp bindings for production inference (optional, enabled with llama-cpp feature)
# Provides 50-100x speedup over Candle for GGUF models
llama_cpp = { version = "0.3.2", optional = true, default-features = false, features = ["compat", "native"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Observability
tracing = { workspace = true }

# Utilities
uuid = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
num_cpus = { workspace = true }
humansize = { workspace = true }
dirs = "6.0"
fastrand = "2.2"
sysinfo = "0.38"
ureq = { version = "3.2", features = ["native-tls"] }

# Compression (HCT format for compressed weights)
haagenti = { workspace = true }
haagenti-core = { workspace = true }
haagenti-hct = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

# GPU decompression (optional)
haagenti-cuda = { workspace = true, optional = true }

# Neural compression for 10:1 ratio (optional) - not yet published
# haagenti-neural = { workspace = true, optional = true }

# Half-precision floats
half = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
criterion = { workspace = true }
proptest = { workspace = true }
memmap2 = { workspace = true }
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.10"
bytemuck = "1.25"
zstd = "0.13"
lz4_flex = "0.12"

[[bench]]
name = "inference"
harness = false

[[bench]]
name = "weight_loading"
harness = false

[[bench]]
name = "holographic"
harness = false

[[bench]]
name = "holotensor_405b_bench"
harness = false

[[example]]
name = "gpu_hct_test"
required-features = ["cuda"]

[[example]]
name = "convert_to_holo"

[[example]]
name = "gpu_lrdf_bench"
required-features = ["cuda"]

[[example]]
name = "holo_to_safetensors"
required-features = ["cuda"]

[[example]]
name = "speculative_405b"
required-features = ["cuda"]

[lints]
workspace = true
