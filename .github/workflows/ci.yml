name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Workaround for aws-lc-sys compiler bug check
  AWS_LC_SYS_PREBUILT_NASM: 1
  # Platform-independent features (excludes cuda, metal which require hardware)
  # Note: lance temporarily excluded due to arrow version incompatibility (tracked in #33)
  SAFE_FEATURES: "--features llama-cpp,holotensor,integration-tests"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --workspace ${{ env.SAFE_FEATURES }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: cargo clippy --workspace ${{ env.SAFE_FEATURES }} -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            features: "--features llama-cpp,holotensor,integration-tests"
            # Test full workspace on Linux
            exclude_crates: ""
          - os: macos-latest
            features: "--features llama-cpp,holotensor,metal,integration-tests"
            # Exclude infernum-server on macOS due to arcanum-primitives SIMD bug on ARM
            # See: arcanum-primitives 0.1.2 uses x86_64-only SIMD intrinsics unconditionally
            exclude_crates: "--exclude infernum-server"
          - os: windows-latest
            features: "--features llama-cpp,holotensor,integration-tests"
            # Test full workspace on Windows
            exclude_crates: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace ${{ matrix.features }} ${{ matrix.exclude_crates }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --workspace --no-deps ${{ env.SAFE_FEATURES }}
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check --workspace ${{ env.SAFE_FEATURES }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
