[package]
name = "infernum-comparison"
version = "0.1.0"
edition = "2021"
description = "Testing harness for Rust/Sigil A/B comparison"

[dependencies]
# No external infernum dependency - this is a standalone test harness
# Tests are run against both Rust and Sigil implementations independently

# Async
tokio = { version = "1.48", features = ["full", "test-util", "macros"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.16", features = ["v4", "serde"] }
glob = "0.3"

# Testing
criterion = "0.5"

[[bin]]
name = "run-tests"
path = "src/bin/run_tests.rs"

[[bench]]
name = "streaming"
harness = false

[[bench]]
name = "optimized_engine_bench"
harness = false
