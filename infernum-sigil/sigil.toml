[package]
name = "infernum-sigil"
version = "0.1.0"
description = "Sigil implementation of Infernum LLM inference core"
authors = ["Daemoniorum Inc."]
license = "MIT OR Apache-2.0"

[dependencies]
# Standard library modules
std = "0.1"

# Serialization
serde = "0.1"
json = "0.1"

# UUID generation
uuid = "0.1"

# Async runtime
async = "0.1"

[dev-dependencies]
test = "0.1"
benchmark = "0.1"

[features]
default = []
simd = []  # Enable SIMD optimizations for sampling

[profile.release]
opt-level = 3
lto = true
